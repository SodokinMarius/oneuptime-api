upstream django {
    # Gunicorn — 3 workers dans le service "web"
    server web:8000;
}

# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # Certificats TLS — montés via volume dans docker-compose.prod.yml
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Protocoles et ciphers modernes
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Taille max des requêtes (uploads)
    client_max_body_size 10M;

    # Timeouts
    proxy_read_timeout  30s;
    proxy_connect_timeout 10s;
    proxy_send_timeout  30s;

    # Static files — servis directement par Nginx (100x plus rapide que Django)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media files (si applicable)
    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # Swagger UI / OpenAPI (pas de cache)
    location /api/v1/docs {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }

    # API Django (via Gunicorn)
    location /api/ {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
        proxy_buffering    off;
    }

    # SCIM 2.0 (SSO)
    location /scim/ {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
    }

    # Frontend React (Vite build — dist/ monté sur /app/frontend)
    location / {
        root /app/frontend;
        try_files $uri $uri/ /index.html;
    }

    # Health check Nginx (pour load balancer)
    location /nginx-health {
        return 200 "ok\n";
        access_log off;
    }
}
